name: Floor check experiment red blue

on:
  push:
    branches:
      - exp-floor-redblue

jobs:
  red-blue:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Red, poisoned buildenv 14164a5c must fail the audit
        id: red
        run: |
          set -euo pipefail
          url="https://downloads.mixxx.org/dependencies/2.7-rel/Linux/mixxx-deps-2.7-x64-linux-rel-14164a5c.zip"
          mkdir -p /tmp/red && cd /tmp/red
          curl -sL -o a.zip "$url"
          unzip -qq a.zip
          toolsdir=$(find . -type d -path '*installed/x64-linux-release/tools' | head -1)
          libdir=$(find . -type d -path '*installed/x64-linux-release/lib' | head -1)
          echo "toolsdir=$toolsdir libdir=$libdir"
          [ -n "$toolsdir" ] && [ -n "$libdir" ] || { echo "layout not found"; exit 1; }
          failed=0
          while IFS= read -r -d '' f; do
            file "$f" | grep -q ELF || continue
            python3 "$GITHUB_WORKSPACE/.github/check_appimage_floor_deps.py" "$f" "$libdir" || failed=1
          done < <(find "$toolsdir" -type f -print0)
          echo "red_failed=$failed"
          echo "red_failed=$failed" >> "$GITHUB_ENV"

      - name: Blue, clean buildenv c2a79b5e must pass the audit
        id: blue
        run: |
          set -euo pipefail
          url="https://downloads.mixxx.org/dependencies/2.7-rel/Linux/mixxx-deps-2.7-x64-linux-rel-c2a79b5e.zip"
          mkdir -p /tmp/blue && cd /tmp/blue
          curl -sL -o a.zip "$url"
          unzip -qq a.zip
          toolsdir=$(find . -type d -path '*installed/x64-linux-release/tools' | head -1)
          libdir=$(find . -type d -path '*installed/x64-linux-release/lib' | head -1)
          echo "toolsdir=$toolsdir libdir=$libdir"
          [ -n "$toolsdir" ] && [ -n "$libdir" ] || { echo "layout not found"; exit 1; }
          failed=0
          while IFS= read -r -d '' f; do
            file "$f" | grep -q ELF || continue
            python3 "$GITHUB_WORKSPACE/.github/check_appimage_floor_deps.py" "$f" "$libdir" || failed=1
          done < <(find "$toolsdir" -type f -print0)
          echo "blue_failed=$failed"
          echo "blue_failed=$failed" >> "$GITHUB_ENV"

      - name: Assert red failed and blue passed
        run: |
          set -euo pipefail
          echo "red_failed=${red_failed:-unset} blue_failed=${blue_failed:-unset}"
          [ "${red_failed:-}" = 1 ] || { echo "ASSERT FAIL, poisoned buildenv passed the audit"; exit 1; }
          [ "${blue_failed:-}" = 0 ] || { echo "ASSERT FAIL, clean buildenv failed the audit"; exit 1; }
          echo "VALIDATED poisoned buildenv fails the audit while the clean buildenv passes"