name: Floor check experiment red blue

on:
  push:
    branches:
      - exp-floor-redblue

jobs:
  red-blue:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install readelf
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Red, the poisoned x64-linux buildenv 14164a5c must fail the audit
        run: |
          set -euo pipefail
          url="https://downloads.mixxx.org/dependencies/2.7-rel/Linux/mixxx-deps-2.7-x64-linux-rel-14164a5c.zip"
          mkdir -p /tmp/red && cd /tmp/red
          curl -sL -o a.zip "$url"
          unzip -q a.zip 'installed/x64-linux-release/tools/*' 'installed/x64-linux-release/lib/*'
          toolsdir="installed/x64-linux-release/tools"
          libdir="installed/x64-linux-release/lib"
          set +e
          while IFS= read -r -d '' f; do
            file "$f" | grep -q 'ELF' || continue
            python3 "$GITHUB_WORKSPACE/.github/check_appimage_floor_deps.py" "$f" "$libdir"
          done < <(find "$toolsdir" -type f -print0)
          rc=$?
          set -e
          echo "red audit rc=$rc"
          if [ "$rc" = 0 ]; then
            echo "expected the poisoned buildenv to fail the audit, it passed"
            exit 1
          fi
          echo "red audit correctly failed"

      - name: Blue, the good x64-linux buildenv c2a79b5e must pass the audit
        run: |
          set -euo pipefail
          url="https://downloads.mixxx.org/dependencies/2.7-rel/Linux/mixxx-deps-2.7-x64-linux-rel-c2a79b5e.zip"
          mkdir -p /tmp/blue && cd /tmp/blue
          curl -sL -o a.zip "$url"
          unzip -q a.zip 'installed/x64-linux-release/tools/*' 'installed/x64-linux-release/lib/*'
          toolsdir="installed/x64-linux-release/tools"
          libdir="installed/x64-linux-release/lib"
          while IFS= read -r -d '' f; do
            file "$f" | grep -q 'ELF' || continue
            python3 "$GITHUB_WORKSPACE/.github/check_appimage_floor_deps.py" "$f" "$libdir"
          done < <(find "$toolsdir" -type f -print0)
          echo "blue audit passed"