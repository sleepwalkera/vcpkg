name: Build

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read # Fetch code (actions/checkout)
  packages: write # Upload and publish packages to GitHub Packages

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            deps_name: x64-windows
            vcpkg_path: C:\mixxx-vcpkg
            vcpkg_bootstrap: .\bootstrap-vcpkg.bat
            vcpkg_triplet: x64-windows
            vcpkg_host_triplet: x64-windows
            check_disk_space: Get-PSDrive
          - os: windows-11-arm
            deps_name: arm64-windows
            vcpkg_path: C:\mixxx-vcpkg
            vcpkg_bootstrap: .\bootstrap-vcpkg.bat
            vcpkg_triplet: arm64-windows
            vcpkg_host_triplet: arm64-windows
            check_disk_space: Get-PSDrive
          - os: macos-15-intel
            deps_name: x64-osx
            vcpkg_path: /Users/runner/mixxx-vcpkg
            vcpkg_bootstrap: ./bootstrap-vcpkg.sh
            vcpkg_triplet: x64-osx-min1100
            vcpkg_host_triplet: x64-osx-min1100
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
            check_disk_space: df -h
          - os: macos-15-intel
            deps_name: arm64-osx-cross
            vcpkg_path: /Users/runner/mixxx-vcpkg
            vcpkg_bootstrap: ./bootstrap-vcpkg.sh
            vcpkg_triplet: arm64-osx-min1100
            vcpkg_host_triplet: x64-osx-min1100-release
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
            check_disk_space: df -h
          - os: macos-15
            deps_name: arm64-osx
            vcpkg_path: /Users/runner/mixxx-vcpkg
            vcpkg_bootstrap: ./bootstrap-vcpkg.sh
            vcpkg_triplet: arm64-osx-min1100
            vcpkg_host_triplet: arm64-osx-min1100
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
            brew_extra: libtool
            check_disk_space: df -h
          # The Linux buildenvs are built inside a Rocky 8 container on the
          # current runners, same as the 2.6 buildenv and AppImage jobs. This
          # keeps the buildenv (and the host tools shipped in it) on the
          # glibc 2.28 / gcc-toolset floor instead of a runner image that is
          # already deprecated, and it shares that floor with the android
          # buildenv whose host tools come from the same x64-linux-release
          # binary cache.
          - os: ubuntu-24.04
            deps_name: x64-linux
            vcpkg_path: /home/runner/mixxx-vcpkg
            vcpkg_bootstrap: ./bootstrap-vcpkg.sh
            vcpkg_triplet: x64-linux
            vcpkg_host_triplet: x64-linux
            container:
              image: rockylinux:8
              volumes:
                - "/:/host"
            linux_container: true
            check_disk_space: df -h
            vcpkg_max_concurrency: 2
          - os: ubuntu-24.04-arm
            deps_name: arm64-linux
            vcpkg_path: /home/runner/mixxx-vcpkg
            vcpkg_bootstrap: ./bootstrap-vcpkg.sh
            vcpkg_triplet: arm64-linux
            vcpkg_host_triplet: arm64-linux
            container:
              image: rockylinux:8
              volumes:
                - "/:/host"
            linux_container: true
            check_disk_space: df -h
            vcpkg_max_concurrency: 2
          - os: ubuntu-24.04
            deps_name: arm64-android
            vcpkg_path: /home/runner/mixxx-vcpkg
            vcpkg_bootstrap: ./bootstrap-vcpkg.sh
            vcpkg_triplet: arm64-android
            vcpkg_host_triplet: x64-linux-release
            android_api: 36
            android_version: 36.0.0
            android_ndk: 27.2.12479018
            container:
              image: rockylinux:8
              volumes:
                - "/:/host"
            linux_container: true
            check_disk_space: df -h
            vcpkg_max_concurrency: 2
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      DEPS_BASE_NAME: mixxx-deps
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      MIXXX_VERSION: 2.7
    name: ${{ matrix.deps_name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
    - name: Check out git repository
      uses: actions/checkout@v4
      with:
        path: mixxx-vcpkg

      # The job container writes to the runner's root disk and cannot see the
      # ephemeral mount, and a full 2.7 debug+release build does not fit in the
      # root disk. The runner root is mounted at /host, so drop the tool caches
      # a container build does not use (the same paths the old ubuntu-22.04
      # buildenv job freed on the host directly).
    - name: "[Rocky8] Free space on the runner disk"
      if: matrix.linux_container
      shell: bash
      run: |
          rm -rf /host/home/packer                 # Free up 677M
          rm -rf /host/opt/az                      # Free up 649M
          rm -rf /host/opt/google                  # Free up 378M
          rm -rf /host/opt/hostedtoolcache/CodeQL  # Free up 1.6G
          rm -rf /host/opt/hostedtoolcache/go      # Free up 808M
          rm -rf /host/opt/hostedtoolcache/node    # Free up 532M
          rm -rf /host/opt/hostedtoolcache/PyPy    # Free up 520M
          rm -rf /host/opt/hostedtoolcache/Python  # Free up 1.5G
          rm -rf /host/opt/microsoft               # Free up 781M
          rm -rf /host/opt/pipx                    # Free up 499M
          rm -rf /host/usr/lib/google-cloud-sdk    # Free up 957M
          rm -rf /host/usr/local/julia*            # Free up ~1G
          rm -rf /host/usr/local/share/powershell  # Free up 1.3G
          rm -rf /host/usr/share/dotnet            # Free up 3.4G
          rm -rf /host/usr/share/swift             # Free up 3.2G
          rm -rf /host/usr/local/share/vcpkg       # duplicate vcpkg checkout
          rm -rf /host/opt/ghc                     # Free up ~2G (Haskell)
          rm -rf /host/usr/local/graalvm           # Free up ~1G
          rm -rf /host/usr/local/lib/node_modules  # Free up ~500M
          rm -rf /host/usr/share/postgresql        # Free up ~1G
          rm -rf /host/usr/share/mysql             # Free up ~800M
          rm -rf /host/usr/local/lib/php           # Free up ~600M
          rm -rf /host/opt/hostedtoolcache/Ruby    # Free up ~300M
          rm -rf /host/opt/hostedtoolcache/Rust    # Free up ~700M
          df -h /

      # The Linux buildenvs used to be built on the ubuntu-22.04 runner
      # images, which GitHub retires in spring 2027. Build them in the same
      # Rocky 8 container and with the same gcc-toolset-12 as the 2.6
      # buildenv and AppImage jobs instead: the runtime floor stays glibc
      # 2.28, and GCC 12 is a stable toolset on Rocky 8, well above the
      # compiler level Qt and the 2.7 ports require.
    - name: "[Rocky8] Install dependencies for vcpkg"
      if: matrix.linux_container
      shell: bash
      run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled powertools
          dnf install -y gcc-toolset-12 libatomic cmake ninja-build git curl unzip zip tar perl \
            rsync openssh-clients mono-complete \
            file binutils java-17-openjdk-devel \
            perl-IPC-Cmd perl-Data-Dumper perl-Text-Template perl-Time-HiRes perl-Test-Harness \
            autoconf autoconf-archive autoconf2.7x automake bison flex nasm pkgconfig \
            python39 python39-jinja2 alsa-lib-devel pulseaudio-libs-devel \
            mesa-libEGL-devel mesa-libGL-devel mesa-libgbm-devel \
            mesa-libGLU-devel libdrm-devel libSM-devel libudev-devel \
            libX11-devel libxcb-devel xcb-util-devel xcb-util-image-devel \
            xcb-util-keysyms-devel xcb-util-renderutil-devel xcb-util-wm-devel \
            xcb-util-cursor-devel libXi-devel libXrandr-devel libXrender-devel \
            libxkbcommon-devel libxkbcommon-x11-devel libtool libtool-ltdl-devel \
            gettext gettext-devel \
            glibc-devel kernel-headers
          # gperf 3.3 (and possibly other 2.7 ports) regenerate their build
          # system with autoreconf, which needs autoconf >= 2.70. Rocky 8
          # ships 2.69, but EPEL provides 2.71 side-by-side as
          # /usr/bin/autoconf27 etc. Shadow the system commands through
          # /usr/local/bin, which precedes /usr/bin on the PATH.
          for tool in autoconf autoheader autom4te autoreconf autoscan autoupdate ifnames; do
            ln -sf "/usr/bin/${tool}27" "/usr/local/bin/${tool}"
          done
          # RHEL 8's default python3 (3.6) is too old for meson; use python39.
          alternatives --set python3 /usr/bin/python3.9
          source /opt/rh/gcc-toolset-12/enable
          echo "PATH=${PATH}" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "${GITHUB_ENV}"
          # vcpkg's compiler probe re-roots the PATH entries through the
          # installed prefix, then falls back to /usr/bin/cc, which on this
          # image is the system GCC 8; the image ships no /usr/bin/c++, so C++
          # already lands on the toolset. Point /usr/bin/cc at the toolset so
          # C and C++ are both GCC 12 (pipewire 1.6.7 does not compile with
          # GCC 8, and mixing the two compilers breaks libffi's aarch64
          # atomics). Cross builds (android) get their compiler from the NDK
          # toolchain and are unaffected.
          ln -sfn "$(command -v gcc)" /usr/bin/cc
          # The container has no /home/runner directory; the vcpkg_path
          # used by the later steps lives there.
          mkdir -p /home/runner
          # The nuget binary cache needs the nuget client; on Linux it runs under mono.
          curl -fsSL -o /usr/local/bin/nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
          printf '#!/bin/sh\nmono /usr/local/bin/nuget.exe "$@"\n' > /usr/local/bin/nuget
          chmod +x /usr/local/bin/nuget

    - name: Move checkout (container)
      if: matrix.linux_container
      shell: bash
      run: |
        mkdir -p "${{ matrix.vcpkg_path }}"
        cp -a "${GITHUB_WORKSPACE}/mixxx-vcpkg/." "${{ matrix.vcpkg_path }}/"

      # Workaround for issues https://github.com/microsoft/vcpkg/issues/8272
      # and https://github.com/actions/checkout/issues/197
      # to keep the build path short and work around size limits on the windows runner D: drive
    - name: Move checkout
      if: runner.os != 'Linux'
      run: cmake -E copy_directory ${{ github.workspace }}/mixxx-vcpkg ${{ matrix.vcpkg_path }}

    - name: "Work around actions/runner-images#9966"
      if: matrix.os == 'macos-15-intel'
      run: |
        brew list -1 | grep python@ | while read formula; do
          brew unlink $formula
          brew link --overwrite $formula
        done
       
  
    - name: "[macOS] Install dependencies for nuget & vcpkg"
      if: runner.os == 'macOS'
      run: |
          brew update-if-needed && brew install automake nasm autoconf-archive nuget ${{ matrix.brew_extra }}
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcrun --show-sdk-version

    - name: "Authenticate to GitHub Packages (readwrite)"
      if: github.event_name == 'push' && github.repository_owner == 'mixxxdj'
      shell: bash
      run: |
        NUGET="nuget"
        if [ "$RUNNER_OS" = "Linux" ] && [ ! -f /usr/local/bin/nuget.exe ]; then NUGET="mono /usr/local/bin/nuget"; fi
        $NUGET sources add -Name "mixxx-github-packages" -Source "https://nuget.pkg.github.com/mixxxdj/index.json" -UserName "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText
        $NUGET setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "mixxx-github-packages"
        echo "VCPKG_BINARY_SOURCES=clear;nuget,mixxx-github-packages,readwrite;" >> "${GITHUB_ENV}"
        
    - name: "Authenticate to GitHub Packages (read only)"
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        NUGET="nuget"
        if [ "$RUNNER_OS" = "Linux" ] && [ ! -f /usr/local/bin/nuget.exe ]; then NUGET="mono /usr/local/bin/nuget"; fi
        $NUGET sources add -Name "mixxx-github-packages" -Source "https://nuget.pkg.github.com/mixxxdj/index.json" -UserName "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText
        $NUGET setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "mixxx-github-packages"
        echo "VCPKG_BINARY_SOURCES=clear;nuget,mixxx-github-packages,read;" >> "${GITHUB_ENV}"   

    - name: Read sha_short
      id: vars
      shell: bash
      # The Rocky 8 container has no git when actions/checkout runs, so the
      # checkout falls back to a source archive without .git; use the event
      # SHA instead (same as the 2.6 workflow).
      run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      working-directory: ${{ matrix.vcpkg_path }}

    - name: Bootstrap vcpkg
      run: ${{ matrix.vcpkg_bootstrap }}
      working-directory: ${{ matrix.vcpkg_path }}

    - name: "[android] Install Android SDK"
      if: startsWith(matrix.deps_name, 'arm64-android')
      shell: bash
      run: |
          # The Rocky 8 container has no runner-provided SDK, so fetch the
          # official command line tools and install our exact pins with
          # sdkmanager, the same flow actions/runner-images uses. The android
          # host tools then share the container floor with the linux buildenvs.
          # The path is the one overlay/triplets/arm64-android.cmake expects
          # (Qt checks the ANDROID_SDK_ROOT CMake variable from the triplet).
          sdk_root=/usr/lib/android-sdk
          mkdir -p "${sdk_root}/cmdline-tools"
          curl -fsSL -o /tmp/commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/commandlinetools.zip -d "${sdk_root}/cmdline-tools"
          mv "${sdk_root}/cmdline-tools/cmdline-tools" "${sdk_root}/cmdline-tools/latest"
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          export JAVA_HOME
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          printf 'y\n%.0s' {1..32} > /tmp/android-licenses.txt
          "${sdkmanager}" --licenses < /tmp/android-licenses.txt
          "${sdkmanager}" --install "platforms;android-${{ matrix.android_api }}" "platform-tools" "build-tools;${{ matrix.android_version }}" "ndk;${{ matrix.android_ndk }}" < /tmp/android-licenses.txt
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${sdk_root}/ndk/${{ matrix.android_ndk }}" >> "${GITHUB_ENV}"
          "${sdkmanager}" --list_installed

    - name: Check available disk space
      run: ${{ matrix.check_disk_space }}

    # Cap the per-port build parallelism (drives the CMake/ninja -j value).
    # qtdeclarative's debug build exhausts the memory of the Linux runners at
    # the default core count (OOM, exit 137); -j2 keeps peak memory in check.
    # Only set for matrix entries that opt in (vcpkg_max_concurrency), so the
    # other platforms keep their default parallelism.
    - name: Set vcpkg concurrency cap
      if: matrix.vcpkg_max_concurrency
      shell: bash
      run: echo "VCPKG_MAX_CONCURRENCY=${{ matrix.vcpkg_max_concurrency }}" >> "${GITHUB_ENV}"

    - name: Build packages
      run: ./vcpkg install --vcpkg-root=${{ matrix.vcpkg_path }} --clean-after-build --recurse --feature-flags="-compilertracking,manifests,registries,versions" --x-abi-tools-use-exact-versions
      working-directory: ${{ matrix.vcpkg_path }}
      

    # The buildenvs are built on the Rocky 8 (glibc 2.28) floor the AppImage
    # jobs rely on. Host tools restored from the NuGet binary cache may have
    # been built on a newer host and need a newer glibc or libstdc++; verify
    # them against this host's own libc/libstdc++/libgcc_s (the gcc-toolset
    # runtime is on LD_LIBRARY_PATH) before the archive is exported, so the
    # published buildenv always runs on the floor. The audited directory is the
    # host triplet's (only == target triplet for the native linux buildenvs).
    - name: Audit host tools against the build host ABI floor
      if: matrix.linux_container
      shell: bash
      working-directory: ${{ matrix.vcpkg_path }}
      run: bash .github/check_buildenv_floor.sh "vcpkg_installed/${{ matrix.vcpkg_host_triplet }}/tools"

    - name: "[Windows] Sign release DLLs"
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      if: runner.os == 'Windows' && env.AZURE_TENANT_ID
      uses: azure/trusted-signing-action@v2.0.0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: https://weu.codesigning.azure.net/
        signing-account-name: mixxx
        certificate-profile-name: mixxx
        files-folder: ${{ matrix.vcpkg_path }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}/bin
        files-folder-filter: dll
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        timeout: 600
        
    - name: "[Windows] Sign release plugins"
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      if: runner.os == 'Windows' && env.AZURE_TENANT_ID
      uses: azure/trusted-signing-action@v2.0.0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: https://weu.codesigning.azure.net/
        signing-account-name: mixxx
        certificate-profile-name: mixxx
        files-folder: ${{ matrix.vcpkg_path }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}/Qt6/plugins
        files-folder-filter: dll
        files-folder-recurse: true
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        timeout: 600
        
    - name: "[Windows] Sign qml DLLs"
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      if: runner.os == 'Windows' && env.AZURE_TENANT_ID
      uses: azure/trusted-signing-action@v2.0.0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: https://weu.codesigning.azure.net/
        signing-account-name: mixxx
        certificate-profile-name: mixxx
        files-folder: ${{ matrix.vcpkg_path }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}/Qt6/qml
        files-folder-filter: dll
        files-folder-recurse: true
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        timeout: 600

    - name: Upload GitHub Actions artifacts of build logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ matrix.deps_name }}
        path: ${{ matrix.vcpkg_path  }}/buildtrees/**/*.log
        archive: true

    - name: Create buildenv archive
      run: ./vcpkg export --vcpkg-root=${{ matrix.vcpkg_path }} --x-all-installed --zip --output=${{ env.DEPS_BASE_NAME }}-${{ env.MIXXX_VERSION }}-${{ matrix.deps_name }}-${{ steps.vars.outputs.sha_short }} --output-dir=${{ matrix.vcpkg_path }}
      working-directory: ${{ matrix.vcpkg_path }}
      
    - name: "[Windows x64] Install additional tools"
      if: matrix.os == 'windows-2022' && env.SSH_PASSWORD != null
      env:
        SSH_PASSWORD: ${{ secrets.DOWNLOADS_HOSTGATOR_DOT_MIXXX_DOT_ORG_KEY_PASSWORD }}
      run: |
        $Env:PATH="C:\msys64\usr\bin;$Env:PATH"
        pacman -S --noconfirm coreutils bash rsync openssh
        Add-Content -Path "$Env:GITHUB_ENV" -Value "PATH=$Env:PATH"
        
    - name: "[Windows ARM64] Install additional tools"
      if: matrix.os == 'windows-11-arm' && env.SSH_PASSWORD != null
      env:
        SSH_PASSWORD: ${{ secrets.DOWNLOADS_HOSTGATOR_DOT_MIXXX_DOT_ORG_KEY_PASSWORD }}
      run: |
        choco install msys2 -y
        $Env:PATH="C:\tools\msys64\usr\bin;$Env:PATH"
        pacman -S --noconfirm coreutils bash rsync openssh
        Add-Content -Path "$Env:GITHUB_ENV" -Value "PATH=$Env:PATH"

    - name: "Upload build to downloads.mixxx.org"
      if: github.event_name == 'push' && env.SSH_PASSWORD != null
      # Use retry loop to work around intermittent transfer issue
      uses: nick-fields/retry@9417ab499314dfe692edb043ded2ff9b3f5f0a68 # v3
      with:
        shell: bash
        max_attempts: 10
        timeout_minutes: 20
        retry_wait_seconds: 5
        command: |
          cd ${{ matrix.vcpkg_path }}
          .github/deploy.sh ${{ env.DEPS_BASE_NAME }}-${{ env.MIXXX_VERSION }}-${{ matrix.deps_name }}-${{ steps.vars.outputs.sha_short }}.zip
      env:
        DESTDIR: public_html/downloads/dependencies
        OS: ${{ runner.os }}
        SSH_HOST: downloads-hostgator.mixxx.org
        SSH_KEY: ${{ secrets.DOWNLOADS_HOSTGATOR_DOT_MIXXX_DOT_ORG_KEY }}
        SSH_PASSWORD: ${{ secrets.DOWNLOADS_HOSTGATOR_DOT_MIXXX_DOT_ORG_KEY_PASSWORD }}
        SSH_USER: mixxx
        UPLOAD_ID: ${{ github.run_id }}

    - name: Upload GitHub Actions artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.DEPS_BASE_NAME }}-${{ env.MIXXX_VERSION }}-${{ matrix.deps_name }}-${{ steps.vars.outputs.sha_short }}
        path: ${{ matrix.vcpkg_path }}/${{ env.DEPS_BASE_NAME }}-${{ env.MIXXX_VERSION }}-${{ matrix.deps_name }}-${{ steps.vars.outputs.sha_short }}.zip
        archive: false

    # Workaround for https://github.com/actions/cache/issues/531
    - name: Use system tar & zstd from Chocolatey for caching
      shell: bash
      run: |
        echo "C:/Windows/System32;C:/ProgramData/Chocolatey/bin" >> $GITHUB_PATH
